name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Engine tests
        run: .\gradlew.bat :engine:test --no-daemon

      - name: Package zip
        run: powershell -ExecutionPolicy Bypass -File package.ps1 -SkipWebBuild

      - uses: actions/upload-artifact@v4
        with:
          name: loot-radar-dist
          path: |
            dist/*.zip
          if-no-files-found: error
