name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Engine tests
        run: .\gradlew.bat :engine:test --no-daemon

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File tools/package.ps1 -SkipWebBuild

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/loot-radar-*.zip
          generate_release_notes: true
